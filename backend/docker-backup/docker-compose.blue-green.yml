version: '3.8'

services:
  # Blue (기존) API 서버
  api-blue:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/neulbo
      - DB_USERNAME=neulbo
      - DB_PASSWORD=password123
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - neulbo-network
    restart: unless-stopped

  # Green (새로운) API 서버
  api-green:
    build: .
    ports:
      - "8081:8080"  # 다른 포트
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/neulbo
      - DB_USERNAME=neulbo
      - DB_PASSWORD=password123
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - neulbo-network
    restart: unless-stopped
    profiles:
      - green  # 기본적으로 비활성화

  # PostgreSQL (공유)
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=neulbo
      - POSTGRES_USER=neulbo
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neulbo-network
    restart: unless-stopped

  # Redis (공유)
  redis:
    image: redis:alpine
    networks:
      - neulbo-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  neulbo-network:
    driver: bridge 